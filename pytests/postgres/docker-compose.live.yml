# Live-only override: hands the real key to the pgjev server process (pgjev falls back to its TYPESAFE_API_KEY env).
# Usage:
#   docker compose -p dbt_decisions_it -f pytests/postgres/docker-compose.yml -f pytests/postgres/docker-compose.live.yml up -d --wait --build
services:
  postgres:
    environment:
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:?set TYPESAFE_API_KEY in your environment for live runs}

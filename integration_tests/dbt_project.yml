name: dbt_decisions_integration_tests
version: "1.0.0"
profile: dbt_decisions_integration_tests
require-dbt-version: [">=1.11.0", "<3.0.0"]

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]

clean-targets:
  - target
  - dbt_packages

vars:
  # Decision columns are probabilities; this is where a ticket counts as "at risk".
  churn_risk_threshold: 0.8

seeds:
  dbt_decisions_integration_tests:
    support_tickets:
      +column_types:
        created_at: timestamp
    ticket_labels:
      +column_types:
        label_churn_risk: boolean
        label_urgency: integer

models:
  dbt_decisions_integration_tests:
    staging:
      +materialized: view
    marts:
      # Decision columns cost one ai_decide call per row per question: store them once.
      +materialized: table

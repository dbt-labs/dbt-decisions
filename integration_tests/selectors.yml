selectors:
  # dbt v2 still tries to build the package's Snowflake-only functions on Databricks, and they fail
  # (https://github.com/dbt-labs/dbt/issues/16875). Default every command to skipping functions.
  - name: default
    default: true
    definition:
      union:
        - method: fqn
          value: "*"
        - exclude:
            - method: resource_type
              value: function

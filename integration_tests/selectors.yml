selectors:
  # dbt v2 still tries to build the package's Snowflake-only functions on every adapter
  # (https://github.com/dbt-labs/dbt/issues/16875) and config can't disable them.
  # Default every command to skipping functions, so a plain `dbt build` works.
  - name: default
    default: true
    definition:
      union:
        - method: fqn
          value: "*"
        - exclude:
            - method: resource_type
              value: function
